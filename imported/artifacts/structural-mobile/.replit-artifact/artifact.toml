kind = "mobile"
previewPath = "/mobile/"
title = "Structural Master Mobile"
version = "1.0.0"
id = "artifacts/structural-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24596

[services.development]
run = "pnpm --filter @workspace/structural-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/structural-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/structural-mobile", "run", "serve" ]

[services.env]
PORT = "24596"
BASE_PATH = "/mobile/"
